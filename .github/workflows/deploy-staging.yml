name: Deploy to Azure Blob Staging

on:
  push:
    branches: ["staging"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to staging container
        run: |
          cat <<'EOF' > config.js
          ${{ secrets.VOYAGR_CONFIG }}
          EOF
          az storage blob upload-batch \
            --account-name "voyagrstorage" \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --destination "staging" \
            --source .
