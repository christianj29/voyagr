<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voyagr | Discover Places</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">Voyagr</div>
      </header>
      <section class="hero">
        <div class="hero-overlay">
          <p class="eyebrow">Voyagr</p>
          <h1>Drop a pin. Chase the memory.</h1>
          <p class="subhead">
            Click a country to see popular activities, then add your own
            experience.
          </p>
        </div>
        <form class="search-panel search-panel--floating" id="country-search-form" role="search">
          <label for="country-search">Search countries</label>
          <div class="search-input">
            <input
              id="country-search"
              name="country-search"
              type="search"
              placeholder="Start typing a country name"
              autocomplete="off"
            />
            <span class="search-status" id="search-status" aria-live="polite"></span>
          </div>
          <div
            class="search-results"
            id="search-results"
            role="listbox"
            aria-label="Country search results"
            hidden
          ></div>
        </form>
        <div class="map-frame">
          <div id="map" class="map-shell" aria-label="World map with country pins"></div>
        </div>
      </section>
    </main>
    <script src="countries-data.js" defer></script>
    <script src="config.js" defer></script>
    <script>
      (function () {
        const config =
          window.VOYAGR_APP_INSIGHTS_CONNECTION_STRING ||
          window.VOYAGR_APP_INSIGHTS?.connectionString;
        if (!config) {
          return;
        }
        const script = document.createElement("script");
        script.src = "https://js.monitor.azure.com/scripts/b/ai.2.min.js";
        script.onload = function () {
          const appInsights = new window.Microsoft.ApplicationInsights.ApplicationInsights(
            {
              config: {
                connectionString: config,
              },
            }
          );
          appInsights.loadAppInsights();
          appInsights.trackPageView();
          window.appInsights = appInsights.appInsights;
        };
        document.head.appendChild(script);
      })();
    </script>
    <script src="app.js" defer></script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC7ny5YH3PNS9drcaOmpIK_NkguIfCtT_M&callback=initMap"
      async
      defer
    ></script>
  </body>
</html>
